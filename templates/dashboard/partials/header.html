<header>
    <h1>{{ title }}</h1>
    {% if user.is_authenticated %}
        <div class="user-box">
            <span>Bienvenido, <strong>{{ user.username }}</strong></span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>
        </div>
    {% endif %}
</header>
